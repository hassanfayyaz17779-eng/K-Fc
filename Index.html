<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC 27 Global Rating & Comparison Hub</title>
    <!-- Google Fonts for Gaming Vibe -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: rgba(18, 24, 38, 0.85);
            --ea-lime: #00ff66;
            --neon-blue: #00d2ff;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); overflow-x: hidden; background-image: radial-gradient(circle at 50% 0%, #16223f 0%, #0b0e14 70%); }
        header { text-align: center; padding: 50px 20px; position: relative; }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 950; text-transform: uppercase; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px rgba(0, 255, 102, 0.6); margin-bottom: 10px; }
        header p { font-size: 1.2rem; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 2px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px 20px; }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; margin-bottom: 25px; text-transform: uppercase; border-left: 4px solid var(--ea-lime); padding-left: 15px; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 60px; }
        @media (max-width: 768px) { .comparison-grid { grid-template-columns: 1fr; } }
        .game-card { background: var(--panel-bg); border-radius: 12px; padding: 30px; position: relative; backdrop-filter: blur(10px); }
        .game-card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .card-fc26 h3 { color: var(--neon-blue); } .card-fc27 h3 { color: var(--ea-lime); }
        .stat-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 1.1rem; }
        .stat-label { color: var(--text-muted); text-transform: uppercase; }
        .rating-badge { background: rgba(255, 255, 255, 0.07); padding: 4px 12px; border-radius: 20px; font-family: 'Orbitron', sans-serif; font-size: 1rem; }
        .form-panel, .reviews-panel { background: var(--panel-bg); border-radius: 12px; padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); }
        .form-control { width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 12px; color: #fff; font-size: 1.1rem; }
        .btn-submit { width: 100%; background: linear-gradient(90deg, #00ff66, #00ffcc); border: none; border-radius: 6px; padding: 14px; color: #000; font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .review-card { background: rgba(0, 0, 0, 0.25); border-left: 3px solid var(--ea-lime); padding: 20px; border-radius: 0 8px 8px 0; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>EA SPORTS FC 27 Hub</h1>
        <p>Global Community Ratings, Reviews, and FC 26 Comparison</p>
    </header>
    <div class="container">
        <h2 class="section-title">FC 26 vs. FC 27 Comparison</h2>
        <div class="comparison-grid">
            <div class="game-card card-fc26">
                <h3>EA SPORTS FC 26 <span class="rating-badge">7.2 / 10</span></h3>
                <div class="stat-row"><span class="stat-label">Pacing</span><span>Balanced</span></div>
            </div>
            <div class="game-card card-fc27">
                <h3>EA SPORTS FC 27 <span class="rating-badge">9.1 / 10</span></h3>
                <div class="stat-row"><span class="stat-label">Pacing</span><span style="color: var(--ea-lime);">Refined & Responsive</span></div>
            </div>
        </div>
        <div class="form-panel">
            <h2 class="section-title" style="font-size: 1.4rem;">Submit Review</h2>
            <form id="reviewForm">
                <div class="form-group"><label>Your Name</label><input type="text" id="username" class="form-control" required></div>
                <div class="form-group"><label>Rating</label><select id="rating" class="form-control" required><option value="10">10</option><option value="9">9</option><option value="8">8</option></select></div>
                <div class="form-group"><label>Review</label><textarea id="reviewContent" class="form-control" rows="3" required></textarea></div>
                <button type="submit" class="btn-submit">Submit To Hub</button>
            </form>
        </div>
        <div style="margin-top:30px;"><h2 class="section-title" style="font-size: 1.4rem;">Global Feed</h2><div id="reviewsContainer"></div></div>
    </div>
    <script>
        const defaultReviews = [{ name: "Marco (Italy)", rating: "9", text: "Smooth mechanics!" }];
        document.addEventListener("DOMContentLoaded", () => {
            loadReviews();
            document.getElementById("reviewForm").addEventListener("submit", (e) => {
                e.preventDefault();
                saveReview({ name: document.getElementById("username").value, rating: document.getElementById("rating").value, text: document.getElementById("reviewContent").value });
                e.target.reset();
            });
        });
        function loadReviews() { renderReviews(JSON.parse(localStorage.getItem("fc27_reviews")) || defaultReviews); }
        function saveReview(r) { let rv = JSON.parse(localStorage.getItem("fc27_reviews")) || defaultReviews; rv.unshift(r); localStorage.setItem("fc27_reviews", JSON.stringify(rv)); renderReviews(rv); }
        function renderReviews(rv) {
            document.getElementById("reviewsContainer").innerHTML = rv.map(i => `<div class="review-card"><strong>${i.name}</strong> (${i.rating}/10)<p>${i.text}</p></div>`).join('');
        }
    </script>
</body>
</html>
